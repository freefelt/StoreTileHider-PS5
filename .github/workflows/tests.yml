# The tests (they run the program on the runner with the paths moved to /tmp: no console, no root needed for the tests themselves).
# On every push and pull request: the smoke suites. "full" (all suites) runs when asked and before a release.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: "Run all the suites instead of the smoke ones"
        type: boolean
        default: false
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ inputs.full }}
  cancel-in-progress: true

jobs:
  # A branch push whose commit already carries a tag is covered by the Release workflow of that tag (the same tests, all of them, and the build), so it is skipped here.
  # Tags are pushed together with the branch, so they are already visible; a pull request, a manual run and the call from Release (a tag ref) always run.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.g.outputs.run }}
    steps:
      - id: g
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            if git ls-remote --tags "https://github.com/$GITHUB_REPOSITORY.git" | awk '{print $1}' | grep -qx "$GITHUB_SHA"; then run=false; fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "run=$run"

  tests:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install clang, the SQLite headers and Python
        run: sudo tests/setup-env.sh

      - name: Build the program for this machine
        run: tests/build/build-test-binaries.sh

      - name: Suites
        run: |
          if [ "${{ inputs.full }}" = "true" ]; then scope=full; else scope=smoke; fi
          scripts/test.sh "$scope"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            /tmp/sth-test-*.txt
            /tmp/sth-test-*.out
          retention-days: 14
